name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Marginalia.slnx --locked-mode
      - run: dotnet format Marginalia.slnx --verify-no-changes --no-restore
      - run: dotnet build Marginalia.slnx --configuration Release --no-restore
      - run: dotnet test Marginalia.slnx --configuration Release --no-build
      - run: dotnet list Marginalia.slnx package --vulnerable --include-transitive
