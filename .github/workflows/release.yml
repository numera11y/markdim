name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.ref_name, '-beta.') && '[{"rid":"win-x64","runner":"windows-latest"},{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-latest"}]' || '[{"rid":"win-x64","runner":"windows-latest"},{"rid":"osx-x64","runner":"macos-latest"},{"rid":"osx-arm64","runner":"macos-latest"},{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify release tag matches project version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          [xml]$props = Get-Content Directory.Build.props
          $projectVersion = $props.Project.PropertyGroup.VersionPrefix
          $versionSuffix = $props.Project.PropertyGroup.VersionSuffix
          if ($versionSuffix) { $projectVersion = "$projectVersion-$versionSuffix" }
          if ($tagVersion -ne $projectVersion) { throw "Tag $tagVersion does not match project version $projectVersion" }
      - name: Build release package
        shell: pwsh
        run: ./packaging/Publish-Release.ps1 -Version ("${{ github.ref_name }}".TrimStart('v')) -RuntimeIdentifier "${{ matrix.rid }}"
      - name: Build Windows setup installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./packaging/windows/Build-Installer.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))
      - name: Build Debian package
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: bash packaging/linux/Build-DebianPackage.sh "${GITHUB_REF_NAME#v}" "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            release/${{ github.ref_name }}/README.txt
            release/${{ github.ref_name }}/**/markdim-v*.zip
            release/${{ github.ref_name }}/**/markdim-v*.zip.sha256
            release/${{ github.ref_name }}/**/markdim-Setup-v*.exe
            release/${{ github.ref_name }}/**/markdim-Setup-v*.exe.sha256
            release/${{ github.ref_name }}/**/markdim-v*.deb
            release/${{ github.ref_name }}/**/markdim-v*.deb.sha256
            release/${{ github.ref_name }}/**/markdim-v*.tar.gz
            release/${{ github.ref_name }}/**/markdim-v*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          files: artifacts/**/*
